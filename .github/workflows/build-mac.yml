name: Build macOS app

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            arch: arm64
          - os: macos-15-intel
            arch: x86_64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Python and Tk
        run: python -c "import sys, tkinter; print(sys.version); print('Tk', tkinter.TkVersion)"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller google-genai pypdf pydantic python-dotenv
          python -m pip install pikepdf || echo "pikepdf skipped"

      - name: Check engine imports
        run: python -c "import trpg_translate_v2; print('engine import OK')"

      - name: Build app
        run: |
          pyinstaller --noconfirm --clean --windowed \
            --name "TRPG Translator" \
            --osx-bundle-identifier com.trpg.translator \
            --paths . \
            --hidden-import trpg_translate_v2 \
            --collect-all google.genai \
            trpg_translate_gui.py

      - name: Sign (ad-hoc) and zip
        run: |
          APP="dist/TRPG Translator.app"
          test -d "$APP"
          test -f "$APP/Contents/MacOS/TRPG Translator"
          codesign --force --deep --sign - "$APP" || true
          xattr -cr "$APP" || true
          ditto -c -k --sequesterRsrc --keepParent "$APP" "TRPG_Translator_mac_${{ matrix.arch }}.zip"
          ls -lh *.zip

      - uses: actions/upload-artifact@v4
        with:
          name: TRPG_Translator_mac_${{ matrix.arch }}
          path: TRPG_Translator_mac_${{ matrix.arch }}.zip
          retention-days: 30
